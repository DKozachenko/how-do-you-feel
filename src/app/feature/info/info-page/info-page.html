<ion-header>
  <ion-toolbar class="toolbar ion-text-center">
    <ion-title>Информация</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-text class="ion-text-center" color="primary">
    <h1>Версия: {{ version }}</h1>
  </ion-text>

  <ion-button class="ion-padding-start ion-padding-end marging-top-xxl" expand="full" (click)="exportData()">
    Экспортировать данные (JSON)
  </ion-button>
</ion-content>
