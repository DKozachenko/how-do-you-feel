<ion-header>
  <ion-toolbar class="toolbar">
    <ion-title>Редактирование эмоции</ion-title>

    <ion-buttons slot="end">
      <ion-button (click)="close(ModalRole.Cancel)">
        <ion-icon slot="icon-only" size="large" src="icons/close-outline.svg" />
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form pw-automation-id="edit-emotion-modal-form" [formGroup]="form">
    <ion-item>
      <ion-input
        class="ion-margin-end"
        labelPlacement="floating"
        label="Название"
        formControlName="name"
        placeholder="Радость"
        pw-automation-id="edit-emotion-modal-form-control"
      />

      <app-emotion-hint-button />
    </ion-item>

    <ion-item>
      <ion-input
        labelPlacement="floating"
        label="Цвет"
        formControlName="color"
        placeholder="Зеленый"
        pw-automation-id="edit-emotion-modal-form-control"
      />
    </ion-item>

    <ion-item>
      <ion-textarea
        class="textarea"
        labelPlacement="floating"
        label="Комментарий"
        formControlName="comment"
        placeholder="Например, причина или обстановка"
        pw-automation-id="edit-emotion-modal-form-control"
      />
    </ion-item>

    <ion-item>
      <ion-input
        labelPlacement="floating"
        label="Дата и время"
        placeholder="01.01.1970 00:00"
        formControlName="dateTime"
        pw-automation-id="edit-emotion-modal-form-control"
      >
        <ion-icon slot="end" src="icons/calendar-outline.svg" aria-hidden="true" />
      </ion-input>
    </ion-item>

    <ion-button class="ion-margin-top" expand="block" [disabled]="form.invalid" (click)="confirmCreation()">
      Сохранить
    </ion-button>
  </form>
</ion-content>
