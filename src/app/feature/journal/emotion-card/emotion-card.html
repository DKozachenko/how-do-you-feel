<ion-card>
  <ion-card-header class="card-header">
    <ion-card-title class="ion-display-flex ion-align-items-center ion-justify-content-between">
      <div class="ion-display-flex ion-align-items-center header-left-group">
        <span class="emotion-name">{{ emotion().name }}</span>

        <div class="color" [style.backgroundColor]="emotion().color"></div>
      </div>

      <div class="ion-display-flex ion-align-items-center">
        <ion-badge class="ion-margin-end" color="light">{{ time() }}</ion-badge>

        <ion-button
          fill="outline"
          color="light"
          pw-automation-id="open-edit-emotion-modal-button"
          (click)="edit.emit(emotion())"
        >
          <ion-icon slot="icon-only" src="icons/eyedrop-outline.svg" />
        </ion-button>

        <ion-button color="danger" pw-automation-id="remove-emotion-button" (click)="remove.emit(emotion().id)">
          <ion-icon slot="icon-only" src="icons/trash-outline.svg" />
        </ion-button>
      </div>
    </ion-card-title>
  </ion-card-header>

  <ion-card-content class="ion-display-flex ion-flex-column card-content">
    <p wrapLines>{{ emotion().comment }}</p>
  </ion-card-content>
</ion-card>
