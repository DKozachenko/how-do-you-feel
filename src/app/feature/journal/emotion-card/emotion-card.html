<ion-card
  blur
  ion-long-press
  [interval]="LONG_PRESS_TIME_MS"
  [blurEnabled]="blurCard()"
  (enableReplaceText)="toggleTextReplace($event)"
  (longPressed)="toggleBlurCard()"
>
  <ion-card-header class="card-header">
    <ion-card-title class="ion-display-flex ion-align-items-center ion-justify-content-between">
      <div class="ion-display-flex ion-align-items-center header-left-group">
        <span class="emotion-name" pw-automation-id="emotion-name">{{
          emotion().name | replaceString: textReplacement()
        }}</span>

        <div class="color" pw-automation-id="emotion-color" [style.backgroundColor]="emotion().color"></div>
      </div>

      <div class="ion-display-flex ion-align-items-center">
        <ion-badge class="ion-margin-end" color="light" pw-automation-id="emotion-time">{{
          time() | replaceString: textReplacement()
        }}</ion-badge>

        <ion-button
          fill="outline"
          color="light"
          pw-automation-id="open-edit-emotion-modal-button"
          [disabled]="blurCard()"
          (click)="edit.emit(emotion())"
        >
          <ion-icon slot="icon-only" src="icons/eyedrop-outline.svg" />
        </ion-button>

        <ion-button
          color="danger"
          pw-automation-id="remove-emotion-button"
          [disabled]="blurCard()"
          (click)="remove.emit(emotion().id)"
        >
          <ion-icon slot="icon-only" src="icons/trash-outline.svg" />
        </ion-button>
      </div>
    </ion-card-title>
  </ion-card-header>

  <ion-card-content class="ion-display-flex ion-flex-column card-content">
    <p wrapLines pw-automation-id="emotion-comment">{{ emotion().comment ?? '' | replaceString: textReplacement() }}</p>
  </ion-card-content>
</ion-card>
