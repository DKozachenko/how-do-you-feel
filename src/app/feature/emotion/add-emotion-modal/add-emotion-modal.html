<ion-header>
  <ion-toolbar class="toolbar">
    <ion-title>Новая запись об эмоции</ion-title>

    <ion-buttons slot="end">
      <ion-button (click)="close(ModalRole.Cancel)">
        <ion-icon slot="icon-only" size="large" src="icons/close-outline.svg" />
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
<ion-content class="ion-padding">
  <form pw-automation-id="emotion-modal-form" [formGroup]="form">
    <ion-item>
      <ion-input
        class="ion-margin-end"
        labelPlacement="floating"
        label="Название"
        formControlName="name"
        placeholder="Радость"
        pw-automation-id="emotion-modal-form-control"
      />

      <ion-button (click)="openEmotionsHintModal()">
        <ion-icon slot="icon-only" size="large" src="icons/information-circle-outline.svg" />
      </ion-button>
    </ion-item>

    <ion-item>
      <ion-input
        labelPlacement="floating"
        label="Цвет"
        formControlName="color"
        placeholder="green"
        pw-automation-id="emotion-modal-form-control"
      />
    </ion-item>

    <ion-item>
      <ion-textarea
        labelPlacement="floating"
        label="Комментарий"
        formControlName="comment"
        placeholder="Например, причина или обстановка"
        pw-automation-id="emotion-modal-form-control"
      />
    </ion-item>

    <ion-button
      class="ion-margin-top"
      expand="block"
      pw-automation-id="emotion-modal-save-button"
      [disabled]="form.invalid"
      (click)="confirmCreation()"
    >
      Сохранить
    </ion-button>
  </form>
</ion-content>
