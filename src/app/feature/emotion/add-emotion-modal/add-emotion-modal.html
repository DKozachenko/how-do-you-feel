<ion-header>
  <ion-toolbar class="toolbar">
    <ion-title>Новая запись об эмоции</ion-title>

    <ion-buttons slot="end">
      <ion-button (click)="close(ModalRole.Cancel)">
        <ion-icon slot="icon-only" size="large" src="icons/close-outline.svg" />
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
<ion-content class="ion-padding">
  <form [formGroup]="form">
    <!-- TODO: подсказка для эмоций -->
    <ion-item>
      <ion-input labelPlacement="floating" label="Название" formControlName="name" placeholder="Радость" />
    </ion-item>

    <ion-item>
      <ion-textarea
        labelPlacement="floating"
        label="Комментарий"
        formControlName="comment"
        placeholder="Например, причина или обстановка"
      />
    </ion-item>

    <ion-button
      class="ion-margin-top"
      expand="block"
      [disabled]="form.invalid"
      (click)="close(ModalRole.Confirm, form.value)"
      >Сохранить</ion-button
    >
  </form>
</ion-content>
