<ion-header>
  <ion-toolbar class="toolbar ion-text-center">
    <ion-title pw-automation-id="page-title">Нравится ({{ likesCount() }})</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-button
    class="ion-padding-start ion-padding-end"
    expand="full"
    pw-automation-id="open-add-action-modal-button"
    (click)="openEditActionModal()"
  >
    Добавить
  </ion-button>

  <app-search pw-automation-id="search" [debounce]="300" (changed)="searchInput.set($event)" />

  <ion-list class="ion-padding-top">
    @for (action of likes() | sortActions: actionOrder() | filterActions: searchInput(); track action.id) {
      <app-action-card
        pw-automation-id="action-card"
        [action]="action"
        (edit)="openEditActionModal(action)"
        (remove)="remove($event)"
      />
    }
  </ion-list>
</ion-content>
