<ion-card class="card">
  <ion-card-header>
    <ion-card-title class="ion-display-flex ion-align-items-center ion-justify-content-between">
      <span class="title-wrap"
        >{{ action().name }}
        <span class="no-wrap">({{ action().rate }} / 10)</span>
      </span>

      <div class="ion-display-flex ion-align-items-center">
        <ion-button size="small" fill="outline" color="light" (click)="edit.emit(action())">
          <ion-icon slot="icon-only" src="icons/eyedrop-outline.svg" />
        </ion-button>

        <ion-button size="small" color="danger" (click)="remove.emit(action().id)">
          <ion-icon slot="icon-only" src="icons/trash-outline.svg" />
        </ion-button>
      </div>
    </ion-card-title>
  </ion-card-header>

  <ion-card-content class="ion-display-flex ion-flex-column">
    <p wrapLines>{{ action().comment }}</p>

    <div class="ion-display-flex ion-flex-column ion-align-items-start ion-margin-top">
      <ion-text class="history-label ion-margin-bottom" color="tertiary">История</ion-text>

      <div class="ion-display-flex ion-flex-wrap history-dates">
        @for (date of action().history | sortDates; track date) {
          <ion-badge color="light">{{ date | date: 'dd.MM.yyyy' }}</ion-badge>
        }
      </div>
    </div>
  </ion-card-content>
</ion-card>
